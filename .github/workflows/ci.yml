name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck dash
      - run: make lint
      - name: POSIX syntax check with dash
        run: dash -n hetzner-download-image.sh && dash -n get.hetzner-download-image.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and jq
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq
      - run: make test
